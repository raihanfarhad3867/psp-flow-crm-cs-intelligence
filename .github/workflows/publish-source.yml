name: Publish curated source
on:
  push:
    paths:
      - .github/workflows/publish-source.yml
      - psp-flow-crm-cs-intelligence-final.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'raihanfarhad3867/psp-flow-crm-cs-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract reviewed source only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          archive = Path('psp-flow-crm-cs-intelligence-final.zip')
          prefix = 'psp-flow-crm-cs-intelligence/'
          excluded = {'docs/CV_READY_EVIDENCE.md', 'docs/CV_LINKEDIN_GITHUB_COPY.md', 'docs/EXECUTIVE_PRESENTATION.md', 'reports/final_readiness_report.md'}
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'Archive integrity failed'
              for member in z.infolist():
                  name = member.filename
                  if not name.startswith(prefix) or member.is_dir():
                      continue
                  rel = name[len(prefix):]
                  p = PurePosixPath(rel)
                  if not rel or p.is_absolute() or '..' in p.parts or '\\' in rel:
                      raise ValueError('Unsafe archive path')
                  if rel in excluded or rel == 'README.md' or rel == 'scripts/load_verified_snapshot.py':
                      continue
                  if rel.startswith(('data/hubspot_', 'reports/live_')) or rel.endswith(('.db', '.pyc')):
                      continue
                  if rel == '.env' or (rel.startswith('.env.') and rel != '.env.example'):
                      continue
                  if any(part in {'.venv', '__pycache__', '.pytest_cache'} for part in p.parts):
                      continue
                  if rel.startswith('.github/'):
                      continue
                  if not (rel in {'app.py', 'requirements.txt', 'sql_schema.sql', 'contracts.md', '.env.example', '.gitignore'} or rel.startswith(('src/', 'scripts/', 'tests/', 'docs/', 'data/raw/', 'data/processed/', 'data/powerbi/', 'reports/'))):
                      continue
                  target = Path(rel)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(member))
          archive.unlink()
          print('Curated source extracted; CRM snapshots and career-positioning files excluded.')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify synthetic build and tests
        run: |
          python scripts/build_demo.py
          python -m pytest -q
      - name: Commit source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish curated CRM application source'
            git push
          fi
